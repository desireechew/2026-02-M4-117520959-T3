services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: tarea3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d tarea3"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - big-data

  bigdata:
    build: ./big-data
    container_name: big-data
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/src/notebooks
      - ./data:/src/data
      - ./output:/src/output
    working_dir: /src
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - big-data

volumes:
  postgres_data:

networks:
  big-data:
    driver: bridge
